<title>Cyber Dawn Power Sheet</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&family=Public+Sans:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
:root{
  --bg:#EDEBE7; --paper:#FFFFFF; --ink:#16181C; --ink-2:#5A6068; --line:#CFCBC4;
  --brass:#8F6114; --brass-soft:#F2E6D2; --signal:#0E5F7A; --signal-soft:#D9EAF1;
  --ok:#2A6340; --ok-soft:#D9EADF; --warn:#98351E; --warn-soft:#F7E1D9;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --body:"Public Sans","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14161A; --paper:#1D2026; --ink:#E8E6E2; --ink-2:#9BA3AC; --line:#333841;
    --brass:#D69A4E; --brass-soft:#3A2C18; --signal:#5BB8D4; --signal-soft:#15323D;
    --ok:#6FBF8E; --ok-soft:#1A3325; --warn:#EE8666; --warn-soft:#3B1D14;
  }
}
:root[data-theme="dark"]{
  --bg:#14161A; --paper:#1D2026; --ink:#E8E6E2; --ink-2:#9BA3AC; --line:#333841;
  --brass:#D69A4E; --brass-soft:#3A2C18; --signal:#5BB8D4; --signal-soft:#15323D;
  --ok:#6FBF8E; --ok-soft:#1A3325; --warn:#EE8666; --warn-soft:#3B1D14;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;margin:0}
.wrap{max-width:880px;margin:0 auto;padding-inline:16px;padding-block:28px 72px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;line-height:1.1;margin:0}
h1{font-size:clamp(30px,6vw,46px);font-weight:900;letter-spacing:-0.015em}
h2{font-size:clamp(20px,3vw,26px);font-weight:700;margin:0}
h3{font-size:17px;font-weight:700;margin:0 0 6px;font-family:var(--display);
   text-transform:uppercase;letter-spacing:.09em;color:var(--brass);font-size:12.5px}
p{margin:10px 0;max-width:70ch}
ul,ol{max-width:70ch;padding-left:22px;margin:10px 0}
li{margin:7px 0}
a{color:var(--signal)}
code{font-family:var(--mono);font-size:.88em;background:var(--signal-soft);padding:1.5px 5px;border-radius:3px;white-space:nowrap}
pre{font-family:var(--mono);font-size:13px;line-height:1.55;background:var(--paper);border:1px solid var(--line);
    padding:12px 14px;overflow-x:auto;border-radius:5px;margin:10px 0}
pre code{background:none;padding:0;white-space:pre}
strong{font-weight:700}
.masthead{border-bottom:4px solid var(--ink);padding-bottom:18px;margin-bottom:8px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass);font-weight:700}
.sub{font-family:var(--mono);font-size:13px;color:var(--ink-2);margin-top:10px;line-height:1.5}
.day{background:var(--paper);border:1px solid var(--line);border-radius:6px;margin:26px 0;overflow:hidden}
.dayhead{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;
         padding:14px 20px;border-bottom:1px solid var(--line);border-left:6px solid var(--brass)}
.daynum{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--brass);white-space:nowrap}
.badge{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.08em;
       background:var(--brass-soft);color:var(--brass);padding:3px 9px;border-radius:999px;margin-left:auto;white-space:nowrap}
.daybody{padding:4px 20px 20px}
.block{margin-top:18px}
.block ol,.block ul{margin-top:6px}
.done{background:var(--ok-soft);border:1px solid var(--ok);border-radius:5px;padding:12px 16px;margin-top:18px}
.done h3{color:var(--ok)}
.done p,.done ul{max-width:none;margin:4px 0}
.trouble{background:var(--paper);border:1px dashed var(--line);border-radius:5px;padding:12px 16px;margin-top:14px}
.trouble h3{color:var(--ink-2)}
.note{padding:13px 17px;margin:18px 0;border-radius:5px;max-width:none}
.note p{max-width:none;margin:5px 0}
.note .lbl{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:5px;font-weight:700}
.warn{background:var(--warn-soft);border:1px solid var(--warn)}
.warn .lbl{color:var(--warn)}
.tip{background:var(--signal-soft);border:1px solid var(--signal)}
.tip .lbl{color:var(--signal)}
.kit{background:var(--brass-soft);border:1px solid var(--brass)}
.kit .lbl{color:var(--brass)}
figure{margin:22px 0;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:16px;overflow-x:auto}
figure svg{max-width:100%;height:auto;display:block;margin:0 auto;color:var(--ink);font-family:var(--body)}
figcaption{font-size:14px;color:var(--ink-2);margin-top:11px;max-width:70ch;line-height:1.5}
table{border-collapse:collapse;width:100%;font-size:15px;margin:14px 0}
.tw{overflow-x:auto}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--display);font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2)}
td.m,th.m{font-family:var(--mono);font-size:13.5px;white-space:nowrap}
.sched{display:grid;grid-template-columns:auto 1fr;gap:0 18px;font-size:15px;margin:16px 0;
       border:1px solid var(--line);border-radius:5px;background:var(--paper);overflow:hidden}
.sched>div{padding:9px 14px;border-bottom:1px solid var(--line)}
.sched>div:nth-last-child(-n+2){border-bottom:0}
.sched .t{font-family:var(--mono);font-size:13px;color:var(--brass);font-weight:700;white-space:nowrap}
.check{list-style:none;padding-left:0}
.check li{padding-left:30px;position:relative}
.check li::before{content:"";position:absolute;left:0;top:6px;width:15px;height:15px;border:2px solid var(--brass);border-radius:3px}
hr{border:0;border-top:3px solid var(--brass);margin:44px 0 0}
@media (max-width:520px){.sched{grid-template-columns:1fr}.sched .t{padding-bottom:0;border-bottom:0}.badge{margin-left:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<style>figure.sheet{padding:0;margin:0} figure.sheet svg{width:100%;height:auto} .wrap{max-width:1400px} @page{size:letter landscape;margin:7mm} @media print{.masthead,figcaption{display:none} .wrap{padding:0}}</style>
<div class="wrap">
<div class="masthead"><div class="eyebrow">Cyber Dawn &middot; Rev B power wiring</div>
<h1>The power sheet</h1>
<div class="sub">The diagram alone, sized for one landscape Letter page. The explanation of each connection is the companion page, <strong>Cyber Dawn Power</strong>. Rev B 2026-10-31: solar removed, compact body, 16340 cell. Updated 2026-11-08: the sunrise lamp tap at the cell.</div></div>
<figure class="sheet"><svg viewBox="0 0 1360 1000" role="img" aria-label="Cyber Dawn power wiring sheet, Rev B"><style>.part{fill:var(--paper);stroke:var(--ink);stroke-width:1.6}.later{fill:var(--paper);stroke:var(--ink-2);stroke-width:1.4;stroke-dasharray:5 4}.cable{fill:var(--brass-soft);stroke:var(--brass);stroke-width:1.4}.title{font:700 17px 'Archivo','Helvetica Neue',Arial,sans-serif;fill:var(--ink)}.sub{font:400 12px 'Public Sans',system-ui,sans-serif;fill:var(--ink-2)}.h1{font:900 24px 'Archivo','Helvetica Neue',Arial,sans-serif;fill:var(--ink)}.pin{font:700 13px 'JetBrains Mono',monospace;fill:var(--ink)}.pinlab{font:700 12px 'JetBrains Mono',monospace;fill:var(--ink)}.fn{font:400 11.5px 'Public Sans',system-ui,sans-serif;fill:var(--ink-2)}.lab{font:700 12.5px 'Public Sans',system-ui,sans-serif;fill:var(--ink)}.rod{fill:none;stroke:var(--ink);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}.bus{fill:none;stroke:var(--brass);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.thin{fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.joint{fill:var(--ink)}.pinend{fill:var(--paper);stroke:var(--ink);stroke-width:1.8}</style><text x="20.0" y="30.0" class="h1" text-anchor="start" >Cyber Dawn, Rev B: the power wiring on one sheet</text><text x="20.0" y="48.0" class="sub" text-anchor="start" >A dot is a joint. A line that hops over another does not touch it. Thick = wire you solder or plug. Brass = JST-PH plugs and the STEMMA QT chain. Every ground symbol is the same ground.</text><text x="1340.0" y="30.0" class="fn" text-anchor="end" >Rev B 2026-10-31: solar removed, one 16340 cell, USB-C through the rear panel · 2026-11-08: the sunrise lamp's tap at the cell</text><rect x="600" y="100" width="260" height="380" rx="9" class="part"/><text x="730.0" y="124.0" class="title" text-anchor="middle" >Charger board</text><text x="730.0" y="142.0" class="sub" text-anchor="middle" >USB-C in · 5 V 1 A out</text><circle cx="600" cy="160" r="4.5" class="pinend"/><text x="610.0" y="165.0" class="pin" text-anchor="start" >VIN</text><text x="662.0" y="165.0" class="fn" text-anchor="start" >solar in: empty</text><circle cx="600" cy="190" r="4.5" class="pinend"/><text x="610.0" y="195.0" class="pin" text-anchor="start" >G</text><text x="662.0" y="195.0" class="fn" text-anchor="start" >its ground: empty</text><circle cx="600" cy="300" r="4.5" class="pinend"/><text x="610.0" y="305.0" class="pin" text-anchor="start" >USB-C</text><text x="662.0" y="305.0" class="fn" text-anchor="start" >5 V in, the port</text><circle cx="860" cy="160" r="4.5" class="pinend"/><text x="850.0" y="165.0" class="pin" text-anchor="end" >5V +</text><circle cx="860" cy="190" r="4.5" class="pinend"/><text x="850.0" y="195.0" class="pin" text-anchor="end" >−</text><circle cx="860" cy="250" r="4.5" class="pinend"/><text x="850.0" y="255.0" class="pin" text-anchor="end" >EN</text><text x="846.0" y="214.0" class="fn" text-anchor="end" >terminal block: 5 V, 1 A</text><text x="798.0" y="254.0" class="fn" text-anchor="end" >leave open = on</text><circle cx="720" cy="480" r="4.5" class="pinend"/><text x="720.0" y="470.0" class="pin" text-anchor="middle" >BAT, JST-PH</text><circle cx="630" cy="400" r="6" class="pinend"/><text x="630.0" y="404.0" class="pinlab" text-anchor="middle" font-size="9px">C</text><text x="641.0" y="404.0" class="fn" text-anchor="start" >orange: charging</text><circle cx="630" cy="424" r="6" class="pinend"/><text x="630.0" y="428.0" class="pinlab" text-anchor="middle" font-size="9px">F</text><text x="641.0" y="428.0" class="fn" text-anchor="start" >red: fault; red + orange = latched</text><circle cx="630" cy="448" r="6" class="pinend"/><text x="630.0" y="452.0" class="pinlab" text-anchor="middle" font-size="9px">5</text><text x="641.0" y="452.0" class="fn" text-anchor="start" >green: 5 V out is live</text><text x="630.0" y="352.0" class="fn" text-anchor="start" >power path: input feeds the load first, surplus charges</text><text x="630.0" y="372.0" class="fn" text-anchor="start" >charge-rate jumper on the back, cut = 500 mA, see left</text><text x="40.0" y="120.0" class="lab" text-anchor="start" >Power-up order, every time</text><text x="40.0" y="142.0" class="fn" text-anchor="start" >1  Cell in the holder. Meter the holder leads: red reads + against black.</text><text x="40.0" y="159.0" class="fn" text-anchor="start" >2  Holder → pigtail → gauge → charger BAT. Green 5 lights, off the cell.</text><text x="40.0" y="176.0" class="fn" text-anchor="start" >3  USB-C in. Green LED: 5 V out is live.</text><text x="40.0" y="193.0" class="fn" text-anchor="start" >4  Then the JST to the controller. It boots on the boost.</text><text x="40.0" y="222.0" class="lab" text-anchor="start" >To flash firmware: pull the 5 V JST first, then plug the controller's USB.</text><text x="40.0" y="238.0" class="fn" text-anchor="start" >Espressif: the USB ports, the 5V pin and the 3V3 pin are three</text><text x="40.0" y="252.0" class="fn" text-anchor="start" >mutually exclusive ways to power the board. Never two at once.</text><rect x="40" y="270" width="190" height="60" rx="9" class="part"/><text x="135.0" y="294.0" class="title" text-anchor="middle" >USB-C wall adapter</text><text x="135.0" y="312.0" class="sub" text-anchor="middle" >owned · 2 A or more</text><path d="M230.0,300.0 L600.0,300.0" class="rod"/><path d="M330,262 L330,286 M330,314 L330,340" class="later"/><text x="338.0" y="274.0" class="fn" text-anchor="start" >rear panel</text><text x="338.0" y="334.0" class="fn" text-anchor="start" >cutout</text><text x="500.0" y="290.0" class="fn" text-anchor="middle" >USB-C cable</text><text x="40.0" y="352.0" class="fn" text-anchor="start" >The cable passes through a cutout in the rear panel into the charger's own USB-C port. No extension,</text><text x="40.0" y="366.0" class="fn" text-anchor="start" >no second port: the controller's USB sockets stay empty. A laptop port's 0.5 A is not enough.</text><text x="40.0" y="420.0" class="lab" text-anchor="start" >The charger, set up for one 16340 cell</text><text x="40.0" y="442.0" class="fn" text-anchor="start" >Cut the charge-rate jumper on the back: closed as shipped = 1 A, cut = 500 mA, 0.5 C.</text><text x="40.0" y="459.0" class="fn" text-anchor="start" >Full from empty in about 2.5 h, so the 6 h safety timer is never reached.</text><text x="40.0" y="476.0" class="fn" text-anchor="start" >Protected 16340s terminate at 4.20 V: the charger's Li-ion profile fits unchanged.</text><text x="40.0" y="493.0" class="fn" text-anchor="start" >VIN and G, the solar / DC input: nothing wired. The 5 W panel is owned stock, in the drawer.</text><text x="40.0" y="510.0" class="fn" text-anchor="start" >EN: leave open, so 5 V is always on.</text><text x="40.0" y="560.0" class="lab" text-anchor="start" >Rev B 2026-10-31 removed from this sheet</text><text x="40.0" y="576.0" class="fn" text-anchor="start" >the solar panel, the DC jack adapter, the DC jack to screw terminals, the panel-mount</text><text x="40.0" y="590.0" class="fn" text-anchor="start" >USB-C extension and the pouch packs. All owned; none wired.</text><rect x="1060" y="100" width="260" height="380" rx="9" class="part"/><text x="1190.0" y="124.0" class="title" text-anchor="middle" >Controller board</text><text x="1190.0" y="142.0" class="sub" text-anchor="middle" >pins grouped by job</text><circle cx="1060" cy="160" r="4.5" class="pinend"/><text x="1070.0" y="165.0" class="pin" text-anchor="start" >5V</text><text x="1130.0" y="165.0" class="fn" text-anchor="start" >powers the board</text><circle cx="1060" cy="190" r="4.5" class="pinend"/><text x="1070.0" y="195.0" class="pin" text-anchor="start" >GND</text><circle cx="1060" cy="330" r="4.5" class="pinend"/><text x="1070.0" y="335.0" class="pin" text-anchor="start" >GPIO39</text><text x="1130.0" y="335.0" class="fn" text-anchor="start" >gauge INT · poll</text><text x="1080.0" y="250.0" class="fn" text-anchor="start" >GPIO8 / GPIO9: the STEMMA QT chain,</text><text x="1080.0" y="264.0" class="fn" text-anchor="start" >wired on the Phase 1 sheet</text><text x="1080.0" y="400.0" class="lab" text-anchor="start" >USB sockets: EMPTY while the 5 V</text><text x="1080.0" y="416.0" class="lab" text-anchor="start" >plug is in. Unplug the JST to flash.</text><text x="1080.0" y="440.0" class="fn" text-anchor="start" >GPIO41 charger status: unused. The</text><text x="1080.0" y="454.0" class="fn" text-anchor="start" >charger has no STAT pad; read the gauge.</text><path d="M860.0,160.0 L920.0,160.0" class="rod"/><path d="M920.0,160.0 L938.0,160.0" class="rod"/><path d="M982.0,160.0 L1000.0,160.0" class="rod"/><rect x="938" y="151" width="19.0" height="18" rx="3" class="cable"/><rect x="963.0" y="151" width="19.0" height="18" rx="3" class="cable"/><path d="M1000.0,160.0 L1060.0,160.0" class="rod"/><path d="M860.0,190.0 L920.0,190.0" class="rod"/><path d="M920.0,190.0 L938.0,190.0" class="rod"/><path d="M982.0,190.0 L1000.0,190.0" class="rod"/><rect x="938" y="181" width="19.0" height="18" rx="3" class="cable"/><rect x="963.0" y="181" width="19.0" height="18" rx="3" class="cable"/><path d="M1000.0,190.0 L1060.0,190.0" class="rod"/><text x="960.0" y="140.0" class="fn" text-anchor="middle" >JST-PH pair, owned</text><text x="960.0" y="214.0" class="fn" text-anchor="middle" >the hard disconnect</text><path d="M1030.0,160.0 L1030.0,182.0 A8,8 0 0 0 1030.0,198.0 L1030.0,680.0 L1150.0,680.0 L1150.0,710.0" class="rod"/><circle cx="1030.0" cy="160.0" r="6" class="joint"/><text x="1036.0" y="640.0" class="lab" text-anchor="start" >5 V</text><rect x="1090" y="710" width="230" height="110" rx="9" class="later"/><text x="1205.0" y="770.0" class="title" text-anchor="middle" >Amplifier</text><text x="1205.0" y="788.0" class="sub" text-anchor="middle" >signals on the Phase 1 sheet</text><circle cx="1150" cy="710" r="4.5" class="pinend"/><text x="1150.0" y="728.0" class="pin" text-anchor="middle" >VIN</text><circle cx="1230" cy="710" r="4.5" class="pinend"/><text x="1230.0" y="728.0" class="pin" text-anchor="middle" >GND</text><path d="M1230.0,710.0 L1230.0,680.0 L1270.0,680.0" class="rod"/><circle cx="1230.0" cy="680.0" r="6" class="joint"/><path d="M1270,680 L1270,692 M1259,692 L1281,692 M1263,697 L1277,697 M1267,702 L1273,702" class="thin"/><line x1="1185" y1="668" x2="1185" y2="692" class="thin"/><line x1="1195" y1="668" x2="1195" y2="692" class="thin"/><path d="M1150.0,680.0 L1185.0,680.0" class="thin"/><circle cx="1150.0" cy="680.0" r="6" class="joint"/><path d="M1195.0,680.0 L1230.0,680.0" class="thin"/><text x="1190.0" y="660.0" class="fn" text-anchor="middle" >220 µF + 100 nF, at the pins</text><text x="1320.0" y="840.0" class="fn" text-anchor="end" >In Phase 1 the amp took 5 V from the controller's 5V pin.</text><text x="1320.0" y="854.0" class="fn" text-anchor="end" >Now that pin is fed, so it is the same rail.</text><rect x="600" y="700" width="260" height="150" rx="9" class="part"/><text x="730.0" y="724.0" class="title" text-anchor="middle" >Fuel gauge</text><text x="730.0" y="742.0" class="sub" text-anchor="middle" >I²C 0x36 · the cell passes through it</text><circle cx="720" cy="700" r="4.5" class="pinend"/><text x="732.0" y="690.0" class="pin" text-anchor="start" >JST-PH</text><circle cx="600" cy="790" r="4.5" class="pinend"/><text x="610.0" y="795.0" class="pin" text-anchor="start" >JST-PH</text><circle cx="860" cy="810" r="4.5" class="pinend"/><text x="850.0" y="815.0" class="pin" text-anchor="end" >INT</text><text x="820.0" y="814.0" class="fn" text-anchor="end" >low = alert</text><circle cx="800" cy="850" r="4.5" class="pinend"/><text x="800.0" y="840.0" class="pin" text-anchor="middle" >STEMMA QT</text><text x="616.0" y="760.0" class="fn" text-anchor="start" >the two JST ports are the same net;</text><text x="616.0" y="774.0" class="fn" text-anchor="start" >cell in one, charger in the other</text><path d="M720.0,480.0 L720.0,554.0" class="r
