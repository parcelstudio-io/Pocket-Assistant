<text x="10" y="260.5" font-size="2.2" text-anchor="start" font-weight="400" font-family="Helvetica, Arial, sans-serif" fill="#000">and lid where your parts actually sit: USB (thin wall or plug hole), screen window = lit area, speaker grille, mic hole, button.</text>
<text x="10" y="265" font-size="2.2" text-anchor="start" font-weight="400" font-family="Helvetica, Arial, sans-serif" fill="#000">Sizes are first estimates from cardboard-mockup.html; the paper model checks space only, not radio range. MOCK-01: send the outside L × W × H.</text>
