<svg xmlns="http://www.w3.org/2000/svg" width="800" height="370" viewBox="0 0 800 370" role="img" aria-labelledby="title desc">
  <title id="title">Closed and open DC circuits</title>
  <desc id="desc">A 3.3 volt bench supply drives 3.3 milliamps through a 1 kilohm resistor when the switch is closed. Opening the switch breaks the loop; voltage remains across the switch while steady current is zero.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#1463ad"/></marker></defs>
  <rect width="800" height="370" rx="12" fill="white"/>
  <g font-family="Arial, sans-serif" fill="#172b4d" font-size="19">
    <text x="28" y="33" font-size="23" font-weight="bold">Closed: a complete loop</text>
    <text x="430" y="33" font-size="23" font-weight="bold">Open: a break in the loop</text>
    <path d="M400 54V343" stroke="#d8e2ec"/>
    <g fill="none" stroke="#172b4d" stroke-width="3">
      <path d="M74 165V105H158M214 105H320V155M320 231V285H74V231"/>
      <path d="M158 105H214"/>
      <rect x="300" y="155" width="40" height="76" rx="2"/>
      <path d="M474 165V105H558M614 105H720V155M720 231V285H474V231"/>
      <path d="M558 105L603 75"/>
      <rect x="700" y="155" width="40" height="76" rx="2"/>
    </g>
    <g fill="#172b4d"><circle cx="158" cy="105" r="5"/><circle cx="214" cy="105" r="5"/><circle cx="558" cy="105" r="5"/><circle cx="614" cy="105" r="5"/><circle cx="74" cy="285" r="4"/><circle cx="474" cy="285" r="4"/></g>
    <g fill="#eff6ff" stroke="#1463ad" stroke-width="2"><rect x="32" y="165" width="84" height="66" rx="8"/><rect x="432" y="165" width="84" height="66" rx="8"/></g>
    <text x="74" y="193" text-anchor="middle">3.3 V</text><text x="74" y="217" text-anchor="middle" font-size="17">supply</text>
    <text x="474" y="193" text-anchor="middle">3.3 V</text><text x="474" y="217" text-anchor="middle" font-size="17">supply</text>
    <text x="84" y="158">+</text><text x="84" y="251">−</text><text x="484" y="158">+</text><text x="484" y="251">−</text>
    <text x="237" y="200">1 kΩ</text><text x="637" y="200">1 kΩ</text>
    <text x="124" y="70" fill="#1463ad">I = 3.3 mA</text><path d="M244 80H302" fill="none" stroke="#1463ad" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="516" y="60" fill="#9a5b00">I = 0 mA</text>
    <text x="100" y="274">GND: 0 V reference</text><text x="500" y="274">GND: 0 V reference</text>
    <path d="M247 307H183" fill="none" stroke="#1463ad" stroke-width="3" marker-end="url(#arrow)"/><text x="70" y="310" fill="#1463ad">return</text>
    <text x="435" y="316" fill="#9a5b00">3.3 V remains across the open switch.</text>
    <text x="28" y="353" font-size="18">Arrows: conventional current. A resistor converts energy, not charge, into heat.</text>
  </g>
</svg>
