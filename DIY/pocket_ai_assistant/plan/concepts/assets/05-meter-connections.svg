<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="title desc">
  <title id="title">Voltmeter parallel, ammeter series</title>
  <desc id="desc">Left: a voltmeter branches across a resistor load in a complete supply loop. Right: an ammeter lies in the only current path between a supply and a resistor load. Current mode must never be placed across a source.</desc>
  <rect width="800" height="400" fill="white"/>
  <g font-family="sans-serif" font-size="19" fill="#172b4d">
    <text x="25" y="35" font-size="22" font-weight="bold">Voltage: compare two nodes</text>
    <text x="418" y="35" font-size="22" font-weight="bold">Current: intercept the flow</text>
    <path d="M397 60V333" stroke="#ccd6e0" stroke-width="2"/>
    <path d="M80 171V100H250V158 M250 222V290H80V229 M250 100H340V172 M340 228V290H250" fill="none" stroke="#1463ad" stroke-width="3"/>
    <circle cx="80" cy="200" r="29" fill="white" stroke="#172b4d" stroke-width="3"/>
    <text x="73" y="192">+</text><text x="73" y="221">−</text>
    <rect x="237" y="158" width="26" height="64" fill="white" stroke="#172b4d" stroke-width="3"/>
    <circle cx="340" cy="200" r="28" fill="white" stroke="#087f8c" stroke-width="3"/>
    <text x="332" y="207" fill="#087f8c">V</text>
    <circle cx="250" cy="100" r="5" fill="#1463ad"/><circle cx="250" cy="290" r="5" fill="#1463ad"/>
    <text x="138" y="194">Resistor</text><text x="160" y="219">load</text>
    <text x="50" y="325">Source</text><text x="220" y="325" fill="#087f8c">High resistance</text>
    <text x="192" y="80" fill="#087f8c">Same two nodes</text>
    <path d="M470 171V100H571 M629 100H725V158 M725 222V290H470V229" fill="none" stroke="#1463ad" stroke-width="3"/>
    <circle cx="470" cy="200" r="29" fill="white" stroke="#172b4d" stroke-width="3"/>
    <text x="463" y="192">+</text><text x="463" y="221">−</text>
    <circle cx="600" cy="100" r="29" fill="white" stroke="#087f8c" stroke-width="3"/>
    <text x="592" y="107" fill="#087f8c">A</text>
    <rect x="712" y="158" width="26" height="64" fill="white" stroke="#172b4d" stroke-width="3"/>
    <text x="603" y="194">Resistor</text><text x="628" y="219">load</text>
    <text x="440" y="325">Source</text><text x="585" y="325" fill="#087f8c">Low resistance</text>
    <text x="510" y="151" fill="#087f8c">One current path</text>
    <rect x="25" y="349" width="750" height="38" rx="6" fill="#fff4e4"/>
    <text x="62" y="375" fill="#9a5b00">Never connect current mode across a source: that is nearly a short.</text>
  </g>
</svg>
