[project]
name = "pocket-server"
version = "0.1.0"
description = "Local server for the Pocket AI character: speech in, LLM, speech out, over one WebSocket."
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.11,<4",
    "openai>=1.60,<3",
    "numpy>=1.26",
]

[project.scripts]
pocket-server = "pocket_server.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pocket_server"]
