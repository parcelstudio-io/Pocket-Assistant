[platformio]
default_envs = cores3-se

[env:cores3-se]
platform = espressif32@7.1.3
board = m5stack-cores3
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    m5stack/M5Unified@0.2.23
    m5stack/M5GFX@0.2.30
    bblanchon/ArduinoJson@7.4.3
build_flags =
    -DCORE_DEBUG_LEVEL=3

