<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc">
  <title id="title">Series and parallel resistance, as seen at terminals A and B</title>
  <desc id="desc">Series resistors lie on one unbranched path from A to B. Parallel resistors each connect to the same two nodes, A and B. Two 10 kilohm resistors therefore give 20 kilohms in series or 5 kilohms in parallel.</desc>
  <rect width="800" height="360" rx="12" fill="white"/>
  <g font-family="Arial, sans-serif" fill="#172b4d" font-size="20">
    <text x="26" y="34" font-size="23" font-weight="bold">Series: one path</text><text x="425" y="34" font-size="23" font-weight="bold">Parallel: the same two nodes</text>
    <path d="M400 54V333" stroke="#d8e2ec"/>
    <g fill="none" stroke="#172b4d" stroke-width="3"><path d="M38 173H79M170 173H221M312 173H360"/><rect x="79" y="151" width="91" height="44"/><rect x="221" y="151" width="91" height="44"/>
      <path d="M438 183H495M495 106V260M495 106H553M495 260H553" stroke="#1463ad"/><path d="M639 106H716V260H639M716 183H768"/><rect x="553" y="84" width="86" height="44"/><rect x="553" y="238" width="86" height="44"/>
    </g>
    <g fill="#172b4d"><circle cx="38" cy="173" r="5"/><circle cx="360" cy="173" r="5"/><circle cx="716" cy="183" r="5"/><circle cx="768" cy="183" r="5"/></g>
    <g fill="#1463ad"><circle cx="438" cy="183" r="5"/><circle cx="495" cy="183" r="5"/></g>
    <text x="38" y="211" text-anchor="middle">A</text><text x="360" y="211" text-anchor="middle">B</text>
    <text x="438" y="217" text-anchor="middle">A</text><text x="768" y="217" text-anchor="middle">B</text>
    <text x="125" y="137" text-anchor="middle">R1 = 10 kΩ</text><text x="267" y="137" text-anchor="middle">R2 = 10 kΩ</text>
    <text x="596" y="72" text-anchor="middle">R1 = 10 kΩ</text><text x="596" y="230" text-anchor="middle">R2 = 10 kΩ</text>
    <text x="48" y="255" fill="#1463ad">Same current; voltage drops add.</text>
    <text x="512" y="176" fill="#1463ad">Same voltage;</text><text x="512" y="202" fill="#1463ad">currents add.</text>
    <text x="58" y="314" font-weight="bold">R_eq = 10 + 10 = 20 kΩ</text>
    <text x="470" y="314" font-weight="bold">R_eq = 10 ∥ 10 = 5 kΩ</text>
    <text x="26" y="349" font-size="18">Equivalent resistance: apply the same A-to-B voltage and draw the same total current.</text>
  </g>
</svg>
