<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc">
  <title id="title">Antenna fields and worst-case fit clearance</title>
  <desc id="desc">Left: fields around a conceptual antenna can couple to nearby metal even without electrical contact. Right: minimum opening minus maximum part size gives worst-case clearance; plugs and movement need additional space.</desc>
  <defs><marker id="dimension" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M10 0L0 5L10 10Z" fill="#172b4d"/></marker></defs>
  <rect width="800" height="420" fill="white"/>
  <g font-family="sans-serif" fill="#172b4d" font-size="18">
    <rect x="20" y="18" width="370" height="382" rx="14" fill="#f4f8fc"/>
    <rect x="410" y="18" width="370" height="382" rx="14" fill="#f4f8fc"/>
    <text x="40" y="52" font-size="22" font-weight="bold">No contact ≠ no interaction</text>
    <rect x="51" y="162" width="127" height="93" rx="5" fill="#dcefee" stroke="#087f8c" stroke-width="2"/>
    <rect x="94" y="187" width="38" height="39" fill="#172b4d"/>
    <path d="M146 193V172H162V152H177" fill="none" stroke="#9a5b00" stroke-width="5"/>
    <path d="M191 131Q230 170 191 211 M208 105Q280 168 208 239 M225 79Q330 170 225 265" fill="none" stroke="#1463ad" stroke-width="3"/>
    <rect x="303" y="105" width="26" height="170" fill="#b6c9d8" stroke="#172b4d" stroke-width="2"/>
    <path d="M311 137Q339 154 319 174Q299 193 321 213" fill="none" stroke="#9a5b00" stroke-width="3"/>
    <text x="56" y="283">board</text>
    <text x="290" y="298">metal</text>
    <text x="39" y="119" fill="#9a5b00">antenna</text>
    <path d="M121 123L155 153" stroke="#9a5b00" stroke-width="2" fill="none"/>
    <text x="44" y="339" fill="#1463ad">Nearby metal changes the fields.</text>
    <text x="44" y="369">Conceptual, not a board pin map.</text>
    <text x="430" y="52" font-size="22" font-weight="bold">Check the allowed extremes</text>
    <rect x="448" y="108" width="35" height="177" fill="#b6c9d8"/>
    <rect x="715" y="108" width="35" height="177" fill="#b6c9d8"/>
    <rect x="500" y="173" width="198" height="85" fill="#dcefee" stroke="#087f8c" stroke-width="3"/>
    <text x="542" y="223">installed part</text>
    <path d="M487 137H711" stroke="#172b4d" stroke-width="2" marker-start="url(#dimension)" marker-end="url(#dimension)"/>
    <text x="507" y="101">smallest opening</text>
    <path d="M504 287H694" stroke="#172b4d" stroke-width="2" marker-start="url(#dimension)" marker-end="url(#dimension)"/>
    <text x="526" y="314">largest part</text>
    <text x="438" y="349">Clearance = opening − part</text>
    <text x="438" y="375" fill="#9a5b00">Also reserve plug + removal space.</text>
  </g>
</svg>
