<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" role="img" aria-labelledby="title desc">
  <title id="title">An active-low button gives a GPIO a defined voltage</title>
  <desc id="desc">A 3.3 volt source feeds a pull-up resistor connected to a GPIO input and an open button. Closing the button completes the loop to supply ground. The input is HIGH released and LOW pressed. A voltage scale shows guaranteed LOW and HIGH regions separated by an undefined region; thresholds are device-specific.</desc>
  <rect width="800" height="430" fill="white"/>
  <g font-family="sans-serif" fill="#172b4d" font-size="19">
    <text x="28" y="32" font-size="22" font-weight="bold">A weak default; a strong button connection</text>
    <g fill="none" stroke-width="3">
      <path d="M92 149V78H275V103M275 158V213H412M275 213V256M275 306V355H92V229" stroke="#1463ad"/>
      <circle cx="92" cy="189" r="40" stroke="#1463ad"/>
      <rect x="260" y="103" width="30" height="55" stroke="#172b4d"/>
      <path d="M275 306 306 270" stroke="#087f8c"/>
      <circle cx="275" cy="256" r="4" stroke="#087f8c"/>
      <circle cx="275" cy="306" r="4" stroke="#087f8c"/>
      <rect x="412" y="182" width="125" height="63" rx="8" stroke="#087f8c"/>
    </g>
    <circle cx="275" cy="213" r="5" fill="#087f8c"/>
    <text x="92" y="180" text-anchor="middle">+</text>
    <text x="92" y="214" text-anchor="middle">−</text>
    <text x="27" y="264" fill="#1463ad">3.3 V</text>
    <text x="317" y="132">Pull-up R</text>
    <text x="475" y="209" text-anchor="middle">GPIO input</text>
    <text x="475" y="234" text-anchor="middle">senses V</text>
    <text x="324" y="291">Button</text>
    <text x="175" y="384" fill="#1463ad">GND = supply return</text>
    <text x="578" y="76" font-weight="bold">Input voltage</text>
    <rect x="587" y="99" width="161" height="71" fill="#e6f4ef"/>
    <rect x="587" y="170" width="161" height="101" fill="#fff2d9"/>
    <rect x="587" y="271" width="161" height="72" fill="#e9f1fb"/>
    <g fill="none" stroke="#172b4d" stroke-width="2"><path d="M580 99V343H748"/><path d="M580 170H748M580 271H748" stroke-dasharray="5 5"/></g>
    <text x="668" y="127" text-anchor="middle">HIGH</text>
    <text x="668" y="153" text-anchor="middle">released</text>
    <text x="668" y="214" text-anchor="middle" fill="#9a5b00">Not guaranteed</text>
    <text x="668" y="239" text-anchor="middle" fill="#9a5b00">avoid this region</text>
    <text x="668" y="301" text-anchor="middle">LOW</text>
    <text x="668" y="327" text-anchor="middle">pressed</text>
    <text x="601" y="369" font-size="18">Limits: see datasheet</text>
    <text x="28" y="416" fill="#9a5b00">Concept circuit. The prototype uses an internal pull-up; no extra resistor needed.</text>
  </g>
</svg>
